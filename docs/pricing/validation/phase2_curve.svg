  <text x="395" y="104" class="point" fill="#237b61">$90.00</text>
  <circle cx="384.0" cy="177.5" r="5" fill="#bb6a19" stroke="white" stroke-width="2"/>
  <text x="395" y="197.5" class="point" fill="#bb6a19">$78.24</text>
  <line x1="89" y1="382" x2="126" y2="382" stroke="#237b61" stroke-width="4"/>
  <text x="136" y="387" class="legend">Normal: minimum $60, power 2</text>
  <line x1="397" y1="382" x2="434" y2="382" stroke="#bb6a19" stroke-width="4"/>
  <text x="444" y="387" class="legend">Urgent: minimum $50, power 1.2</text>
  <text x="384" y="361" text-anchor="middle" class="axis">Days left until move-out</text>
</svg>
