<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative 30-day move-out markdown curves</title>
  <desc id="desc">A $100 starting price falls to $60 with the normal curve and to a seller-chosen $50 urgent minimum with Sell no matter what. At 15 days left, normal suggests $90 and urgent suggests $78.24. Prices are proposals requiring seller approval.</desc>
