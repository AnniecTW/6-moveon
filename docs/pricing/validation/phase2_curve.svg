    text { font-family: Arial, Helvetica, sans-serif; fill: #27342e; }
    .tick { font-size: 14px; fill: #53615a; }
    .point { font-size: 15px; font-weight: 700; }
    .legend { font-size: 15px; font-weight: 600; }
    .axis { font-size: 15px; font-weight: 600; }
  </style>
  <rect width="760" height="410" rx="16" fill="#fffefb"/>
  <text x="78" y="32" font-size="19" font-weight="700">Suggested price over a 30-day window</text>
  <line x1="78" y1="60" x2="690" y2="60" stroke="#e7e9e5"/>
  <text x="65" y="65" text-anchor="end" class="tick">$100</text>
  <line x1="78" y1="114" x2="690" y2="114" stroke="#e7e9e5"/>
  <text x="65" y="119" text-anchor="end" class="tick">$90</text>
  <line x1="78" y1="168" x2="690" y2="168" stroke="#e7e9e5"/>
  <text x="65" y="173" text-anchor="end" class="tick">$80</text>
  <line x1="78" y1="222" x2="690" y2="222" stroke="#e7e9e5"/>
  <text x="65" y="227" text-anchor="end" class="tick">$70</text>
  <line x1="78" y1="276" x2="690" y2="276" stroke="#e7e9e5"/>
  <text x="65" y="281" text-anchor="end" class="tick">$60</text>
  <line x1="78" y1="330" x2="690" y2="330" stroke="#e7e9e5"/>
  <text x="65" y="335" text-anchor="end" class="tick">$50</text>
  <line x1="78" y1="60" x2="78" y2="330" stroke="#59645e" stroke-width="1.5"/>
  <line x1="78" y1="330" x2="690" y2="330" stroke="#59645e" stroke-width="1.5"/>
  <line x1="78.0" y1="330" x2="78.0" y2="336" stroke="#59645e"/>
  <text x="78.0" y="355" text-anchor="middle" class="tick">30</text>
  <line x1="261.6" y1="330" x2="261.6" y2="336" stroke="#59645e"/>
  <text x="261.6" y="355" text-anchor="middle" class="tick">21</text>
  <line x1="404.4" y1="330" x2="404.4" y2="336" stroke="#59645e"/>
  <text x="404.4" y="355" text-anchor="middle" class="tick">14</text>
  <line x1="547.2" y1="330" x2="547.2" y2="336" stroke="#59645e"/>
  <text x="547.2" y="355" text-anchor="middle" class="tick">7</text>
  <line x1="690.0" y1="330" x2="690.0" y2="336" stroke="#59645e"/>
  <text x="690.0" y="355" text-anchor="middle" class="tick">0</text>
  <polyline points="78.0,60.0 88.2,60.1 98.4,60.2 108.6,60.5 118.8,61.0 129.0,61.5 139.2,62.2 149.4,62.9 159.6,63.8 169.8,64.9 180.0,66.0 190.2,67.3 200.4,68.6 210.6,70.1 220.8,71.8 231.0,73.5 241.2,75.4 251.4,77.3 261.6,79.4 271.8,81.7 282.0,84.0 292.2,86.5 302.4,89.0 312.6,91.7 322.8,94.6 333.0,97.5 343.2,100.6 353.4,103.7 363.6,107.0 373.8,110.5 384.0,114.0 394.2,117.7 404.4,121.4 414.6,125.3 424.8,129.4 435.0,133.5 445.2,137.8 455.4,142.1 465.6,146.6 475.8,151.3 486.0,156.0 496.2,160.9 506.4,165.8 516.6,170.9 526.8,176.2 537.0,181.5 547.2,187.0 557.4,192.5 567.6,198.2 577.8,204.1 588.0,210.0 598.2,216.1 608.4,222.2 618.6,228.5 628.8,235.0 639.0,241.5 649.2,248.2 659.4,254.9 669.6,261.8 679.8,268.9 690.0,276.0" fill="none" stroke="#237b61" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
